<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2440" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>宇宙人大戦争</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- タイトル画面 -->
    <section id="screen-title" class="screen">
      <!-- タイトル画像にロゴと TOUCH START が描かれているので、画面全体をスタートボタンにする -->
      <button id="btn-start" class="title-start" aria-label="スタート">
        <img class="title-art" src="assets/title.jpg" alt="宇宙人大戦争" />
      </button>
      <p class="version" id="app-version"></p>
    </section>

    <!-- ワールド選択画面 -->
    <section id="screen-world" class="screen">
      <header class="select-header">
        <button id="btn-world-back" class="btn btn-ghost btn-sm">← タイトル</button>
        <h2>ワールド選択</h2>
        <span id="xp-world" class="xp-badge"></span>
        <button id="btn-zukan" class="btn btn-sm">図鑑</button>
        <button id="btn-team-world" class="btn btn-primary btn-sm">編成・強化</button>
      </header>
      <div id="world-list" class="stage-list"></div>
      <button id="btn-reset" class="btn btn-ghost btn-sm btn-reset">データ消去</button>
    </section>

    <!-- ステージ選択画面(ワールド内) -->
    <section id="screen-select" class="screen">
      <header class="select-header">
        <button id="btn-select-back" class="btn btn-ghost btn-sm">← ワールド選択</button>
        <h2 id="select-title"></h2>
        <span id="xp-select" class="xp-badge"></span>
        <button id="btn-team" class="btn btn-primary btn-sm">編成・強化</button>
      </header>
      <div id="stage-list" class="stage-list"></div>
    </section>

    <!-- 編成・強化画面 -->
    <section id="screen-team" class="screen">
      <header class="select-header">
        <button id="btn-team-back" class="btn btn-ghost btn-sm">← ステージ選択</button>
        <h2>編成・強化</h2>
        <span id="deck-count" class="deck-count"></span>
        <span id="xp-team" class="xp-badge"></span>
      </header>
      <div id="team-grid" class="team-grid"></div>
      <div id="team-message" class="team-message"></div>
    </section>

    <!-- 図鑑 -->
    <section id="screen-zukan" class="screen">
      <header class="select-header">
        <button id="btn-zukan-back" class="btn btn-ghost btn-sm">← もどる</button>
        <h2>図鑑</h2>
        <button class="btn btn-sm zukan-tab active" data-tab="ally">なかま</button>
        <button class="btn btn-sm zukan-tab" data-tab="enemy">てき</button>
        <span id="zukan-count" class="xp-badge"></span>
      </header>
      <div id="zukan-grid" class="zukan-grid"></div>
      <div id="zukan-detail" class="overlay">
        <div class="panel zukan-detail-panel">
          <canvas id="zukan-detail-icon"></canvas>
          <div class="zukan-detail-body">
            <h2 id="zukan-detail-name"></h2>
            <p id="zukan-detail-desc"></p>
            <dl id="zukan-detail-stats" class="result-stats"></dl>
            <button id="btn-zukan-close" class="btn btn-primary">とじる</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 戦闘画面 -->
    <section id="screen-battle" class="screen">
      <div class="hud">
        <div class="hud-item hud-life"><span class="hud-label">ライフ</span><span id="hud-life"></span></div>
        <div class="hud-item"><span id="hud-stage"></span> / <span id="hud-wave"></span></div>
        <div class="hud-item"><span class="hud-label">時間</span><span id="hud-time">00:00</span></div>
        <div class="hud-money">
          <div class="money-bar"><div id="money-fill" class="money-fill"></div></div>
          <span id="hud-money" class="money-text">0 / 0</span>
        </div>
        <button id="btn-pause" class="btn btn-icon" aria-label="ポーズ">II</button>
      </div>
      <div class="field">
        <canvas id="battle-canvas"></canvas>
        <div id="battle-banner" class="banner"></div>
        <div id="intro" class="intro">
          <canvas id="intro-boss" class="intro-boss"></canvas>
          <div id="intro-sub" class="intro-sub"></div>
          <div id="intro-text" class="intro-text"></div>
        </div>
      </div>
      <div class="deck">
        <div class="cost-box">
          <span class="cost-title">コスト <b id="cost-level">Lv1</b></span>
          <span class="cost-now" id="cost-now">0</span>
          <span class="cost-lv-bar"><span id="cost-lv-fill"></span></span>
          <span class="ally-count" id="ally-count"></span>
        </div>
        <div id="unit-buttons" class="unit-buttons"></div>
        <button id="btn-special" class="special-btn" aria-label="必殺技">
          <span class="special-ring"></span>
          <span class="special-label">ビーム</span>
        </button>
      </div>
      <div id="pause-overlay" class="overlay">
        <div class="panel">
          <h2>ポーズ</h2>
          <button id="btn-resume" class="btn btn-primary">再開する</button>
          <button id="btn-retire" class="btn btn-ghost">リタイア</button>
        </div>
      </div>
    </section>

    <!-- 結果画面 -->
    <section id="screen-result" class="screen">
      <div class="panel result-panel">
        <h2 id="result-title" class="result-title"></h2>
        <dl class="result-stats">
          <dt>ステージ</dt><dd id="result-stage"></dd>
          <dt>クリアタイム</dt><dd id="result-time"></dd>
          <dt>撃破数</dt><dd id="result-kills"></dd>
          <dt>獲得EXP</dt><dd id="result-xp" class="xp-text"></dd>
        </dl>
        <div id="result-unlock" class="unlock-card">
          <div class="unlock-rays"></div>
          <canvas id="unlock-icon" class="unlock-icon"></canvas>
          <div class="unlock-text"><small>新しい仲間！</small><b id="unlock-name"></b><span>編成画面で追加できます</span></div>
        </div>
        <div class="result-actions">
          <button id="btn-next" class="btn btn-primary">次のステージへ</button>
          <button id="btn-retry" class="btn">もう一度</button>
          <button id="btn-result-team" class="btn">編成・強化</button>
          <button id="btn-to-select" class="btn btn-ghost">ステージ選択へ</button>
        </div>
      </div>
    </section>

    <!-- 画面切り替えのワイプ -->
    <div id="wipe" class="wipe"></div>

    <!-- 縦画面時の案内 -->
    <div id="rotate-notice">
      <div class="rotate-icon">📱↻</div>
      <p>スマホを横向きにしてください</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
